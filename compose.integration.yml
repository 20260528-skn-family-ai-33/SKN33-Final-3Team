name: borderless-integration
services:
  redis:
    image: redis:7.4-alpine
    command: [redis-server, --appendonly, 'yes', --maxmemory-policy, noeviction]
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: local-root-only
      MYSQL_DATABASE: trade_integration
      MYSQL_USER: integration
      MYSQL_PASSWORD: local-integration-only
    ports:
      - '127.0.0.1:3307:3306'
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: [CMD-SHELL, 'mysqladmin ping -h localhost -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent']
      interval: 5s
      timeout: 3s
      retries: 40
volumes:
  redis-data:
  mysql-data:
