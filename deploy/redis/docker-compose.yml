# (임시) 채팅 에이전트용 Redis. 설계: docs/AGENT_DESIGN.md D-07, §6. Redis 관련 값은 바뀔 수 있다.
# 실행: REDIS_PASSWORD=... docker compose -f deploy/redis/docker-compose.yml up -d
# 배포할 때 이 컨테이너는 내리지 않는다(AOF로 남긴 컨텍스트·되묻기·체크포인트 보존).
services:
  redis:
    image: redis:8.2   # 체크포인터가 RedisJSON·RediSearch를 쓰므로 8 이상
    command: >
      redis-server
      --appendonly yes --appendfsync everysec
      --maxmemory 512mb --maxmemory-policy noeviction
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD를 설정하세요}
    ports:
      - "127.0.0.1:6379:6379"   # 같은 EC2의 API·워커만 접속
    volumes:
      - redis-data:/data
    mem_limit: 768m
    restart: unless-stopped

volumes:
  redis-data:
