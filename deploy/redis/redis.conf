# (임시) 채팅 에이전트용 Redis 설정. 설계: docs/AGENT_DESIGN.md D-07, §6. Redis 관련 값은 바뀔 수 있다.
# redis.conf는 줄 끝 주석을 지원하지 않는다. 주석은 항상 따로 한 줄로 쓴다.
appendonly yes
appendfsync everysec
maxmemory 512mb
# 가득 차면 쓰기가 실패해 채팅 접수가 막힌다(D-06)
maxmemory-policy noeviction

# 비밀번호는 실행 명령에 넣지 않는다(docker inspect·ps에 보임). git에 올리지 않는 redis-auth.conf를 secret으로 읽는다.
include /run/secrets/redis_auth
